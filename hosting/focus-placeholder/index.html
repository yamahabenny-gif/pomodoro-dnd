<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D&amp;D Pomodoro</title>
<meta name="description" content="Fokus wird zum Abenteuer. Eine Cozy-Fantasy-Fokus-App entsteht gerade — bald hier.">
<meta name="theme-color" content="#14110D" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F2EADB" media="(prefers-color-scheme: light)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#14110D; --text:#EDE4D3; --muted:#A8977B; --accent:#D4A72C; --border:#3A3126;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#F2EADB; --text:#241C14; --muted:#6B5B45; --accent:#7E600F; --border:#DFD2BC; }
  }
  *{box-sizing:border-box}
  html{background:var(--bg);color-scheme:dark light}
  body{
    margin:0; min-height:100dvh; background:var(--bg); color:var(--text);
    font-family:"Alegreya Sans",Georgia,serif;
    display:flex; align-items:center; justify-content:center; padding:32px;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  main{ max-width:520px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:22px }
  .ember{ width:40px; height:40px; opacity:.92 }
  .eyebrow{
    margin:0; font-size:13px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
    color:var(--accent);
  }
  h1{
    margin:0; font-family:"Cinzel",Georgia,serif; font-weight:700; letter-spacing:.01em;
    font-size:clamp(28px,5vw,40px); line-height:1.2; text-wrap:balance;
  }
  p.lede{
    margin:0; font-size:17px; line-height:1.6; color:var(--muted); max-width:44ch; text-wrap:pretty;
  }
  .status{
    display:inline-flex; align-items:center; gap:9px; margin-top:4px;
    border:1px solid var(--border); border-radius:999px; padding:8px 18px;
    font-size:13px; color:var(--muted);
  }
  .status i{
    width:7px; height:7px; border-radius:50%; background:var(--accent); display:block;
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }
  @media (prefers-reduced-motion: reduce){ .status i{ animation:none } }
  footer{ margin-top:8px; font-size:12.5px; color:var(--muted); opacity:.8 }
  footer a{ color:inherit }
</style>
</head>
<body>
  <main>
    <svg class="ember" viewBox="0 0 40 40" aria-hidden="true">
      <path d="M20 4c8 9 12 14.5 12 20.5C32 32.4 26.6 38 20 38S8 32.4 8 24.5C8 18.5 12 13 20 4Z" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
      <path d="M20 16c4.2 4.9 6.2 7.9 6.2 11.2A6.2 6.2 0 1 1 13.8 27.2c0-3.3 2-6.3 6.2-11.2Z" fill="var(--accent)" opacity=".85"/>
    </svg>

    <p class="eyebrow">lang-jamin.de</p>
    <h1>Fokus wird zum Abenteuer.</h1>
    <p class="lede">
      Eine Cozy-Fantasy-Fokus-App entsteht: Arbeitszeit wird zur Quest, echte
      Fokuszeit bewegt deinen Charakter durch eine illustrierte Welt und lässt
      dein eigenes Lager wachsen.
    </p>

    <div class="status" role="status"><i aria-hidden="true"></i>Im Bau — bald hier</div>

    <footer>&copy; 2026 lang-jamin.de</footer>
  </main>
</body>
</html>
