<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Nebelmoor Lichtmaske">
  <title>Nebelmoor Lichtmaske</title>
  <desc>Pomodoro DnD #22 mist-moor layer. Adult cozy fantasy. Mystisch, nicht Horror. No text/UI. Safe zones: bottom ~20%, sides 5%, top-right calm.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4a72c" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#d4a72c" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#d4a72c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="822" cy="618" rx="80" ry="60" fill="url(#glow)"/>
  <ellipse cx="1114" cy="658" rx="70" ry="50" fill="url(#glow)"/>
  <!-- faint reflection on water -->
  <ellipse cx="1100" cy="720" rx="90" ry="18" fill="#d4a72c" opacity="0.08"/>

</svg>
