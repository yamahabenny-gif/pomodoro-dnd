<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Bergpfad Lichtmaske">
  <title>Bergpfad Lichtmaske</title>
  <desc>Pomodoro DnD #22 mountain-path layer. Adult cozy fantasy. Ruhig-offen, Horizont, Hochland. No text/UI. Safe zones bottom ~20%, sides 5%, top-right calm.</desc>
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8d4a0" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#d4a72c" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#d4a72c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d4a0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d4a72c" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- late light on ridge / path — sparse -->
  <ellipse cx="1180" cy="420" rx="160" ry="100" fill="url(#sunGlow)"/>
  <path d="M1120 200 L1240 620 L1160 620 Z" fill="url(#shaft)" opacity="0.45"/>
  <ellipse cx="1000" cy="720" rx="100" ry="30" fill="#d4a72c" opacity="0.08"/>

</svg>
