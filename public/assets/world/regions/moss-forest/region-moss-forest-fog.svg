      <stop offset="85%" stop-color="#7a8a86" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6a7a76" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <ellipse cx="700" cy="640" rx="420" ry="120" fill="#a0b0aa" opacity="0.18"/>
  <ellipse cx="1200" cy="700" rx="480" ry="140" fill="#98a8a4" opacity="0.16"/>
