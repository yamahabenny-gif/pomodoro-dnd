  <g stroke-linecap="round">
    <path d="M260 220 C270 420 250 620 255 820" fill="none" stroke="#2a1f16" stroke-width="48"/>
    <path d="M260 220 C270 420 250 620 255 820" fill="none" stroke="#3a2c20" stroke-width="28"/>
