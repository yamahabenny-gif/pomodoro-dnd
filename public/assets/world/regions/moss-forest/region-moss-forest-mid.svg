    <path d="M980 150 C990 380 970 650 985 880" fill="none" stroke="#35281c" stroke-width="36"/>
    <path d="M1380 200 C1365 430 1390 660 1375 870" fill="none" stroke="#241910" stroke-width="52"/>
    <path d="M1380 200 C1365 430 1390 660 1375 870" fill="none" stroke="#3a2c20" stroke-width="30"/>
    <path d="M1680 240 C1695 450 1675 680 1688 860" fill="none" stroke="#2a1f16" stroke-width="44"/>
    <path d="M1680 240 C1695 450 1675 680 1688 860" fill="none" stroke="#3d2e22" stroke-width="24"/>
