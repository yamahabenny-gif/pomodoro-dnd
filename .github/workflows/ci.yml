name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Build, Lint, Typecheck und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Dev smoke test
        run: |
          npm run dev > /tmp/pomodoro-dnd-dev.log 2>&1 &
          DEV_PID=$!
          trap 'kill $DEV_PID' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pomodoro-dnd-dev.log
          exit 1
